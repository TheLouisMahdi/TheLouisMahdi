name: Probe Profile AI Candidate

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ai-candidate-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Test Llama 3.1 8B Fast on profile prompts
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          URL="https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai/run/@cf/meta/llama-3.1-8b-instruct-fast"

          make_payload(){
            node -e 'const q=process.argv[1];console.log(JSON.stringify({messages:[{role:"system",content:"You are the public profile assistant for Mahdi Ghahremani, an Electrical Engineering student at the University of Zanjan focused on computer vision, applied AI, embedded C/C++, Linux, STM32, FPGA/Verilog RTL, simulation, verification, engineering automation and hardware-software co-design. Use ONLY these supplied facts. Do not infer, speculate, add technologies, projects, employers, credentials or dates. If a detail is not supplied, say it is not in the public profile. Reply in the same language as the user, naturally and concisely in 2-4 sentences."},{role:"user",content:q}],max_tokens:160,temperature:.2}))' "$1"
          }

          run_case(){
            label="$1"; question="$2"
            payload="$(make_payload "$question")"
            status="$(curl -sS -o "/tmp/${label}.json" -w '%{http_code}' "$URL" -X POST -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' --data "$payload")"
            echo "=== ${label}: HTTP ${status} ==="
            node - "/tmp/${label}.json" <<'NODE'
          const fs=require("fs");const d=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const r=d.result||d;console.log(JSON.stringify({success:d.success,errors:d.errors,response:r.response||null,usage:r.usage||null},null,2));
          if(d.success===false||typeof r.response!=="string"||!r.response.trim())process.exit(1);
          NODE
            test "$status" = "200"
          }

          run_case english "What can you tell me about Mahdi's FPGA work?"
          run_case persian "مهدی بیشتر روی چه حوزه‌هایی کار می‌کند؟"
          run_case unknown "What company does Mahdi work for?"
