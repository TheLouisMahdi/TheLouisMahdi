name: Apply Liquid Footer Wave

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/apply-liquid-footer-wave.py"
      - ".github/workflows/apply-liquid-footer-wave.yml"

permissions:
  contents: write

concurrency:
  group: liquid-footer-wave
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/liquid-footer-wave
          fetch-depth: 0
      - name: Apply transformation
        run: python3 tools/apply-liquid-footer-wave.py
      - name: Commit production changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html tests/smoke.mjs
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No production changes produced"
            exit 1
          fi
          git commit -m "refactor: simplify hero and add interactive liquid footer"
          git push origin HEAD:agent/liquid-footer-wave
