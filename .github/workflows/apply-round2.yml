name: Apply Windows 7 Round 2 Fixes

on:
  push:
    branches:
      - agent/windows7-simulator-refactor-fixes
    paths:
      - '.round2_payload/**'
      - '.github/workflows/apply-round2.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/windows7-simulator-refactor-fixes
          fetch-depth: 0
      - name: Reconstruct verified Round 2 pack
        shell: bash
        run: |
          set -euo pipefail
          cat .round2_payload/payload_*.b64 | base64 --decode > "$RUNNER_TEMP/round2.zip"
          echo '2d3939ba23a71f2fef4be4c0cd310d496c20e727247bb4b5bde074050fed7665  '"$RUNNER_TEMP/round2.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/round2.zip" -d "$RUNNER_TEMP/round2"
      - name: Apply assertion-based Round 2 patch
        run: python3 "$RUNNER_TEMP/round2/win7_round2/apply_round2.py"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)
          node --check tests/browser-regression.mjs
          node --check tests/core.mjs
      - name: Run smoke and core regression checks
        run: |
          node tests/smoke.mjs
          node tests/core.mjs
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser regression checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > "$RUNNER_TEMP/site.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          node tests/browser.mjs
          node tests/browser-regression.mjs
      - name: Commit verified Round 2 result
        shell: bash
        env:
          BASE_SHA: 453a0334e0548ab0f338d6323f21a7f23a230169
        run: |
          set -euo pipefail
          rm -rf .round2_payload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset --soft "$BASE_SHA"
          git add -A
          git diff --cached --check
          git commit -m "Fix Windows 7 startup and round-two simulator regressions"
          git push --force-with-lease origin HEAD:agent/windows7-simulator-refactor-fixes
