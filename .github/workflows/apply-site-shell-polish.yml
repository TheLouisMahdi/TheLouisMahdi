name: Apply Site Shell Polish

on:
  push:
    branches: [agent/site-shell-polish]
    paths:
      - "tools/apply-site-shell-polish.py"
      - ".github/workflows/apply-site-shell-polish.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/site-shell-polish
          fetch-depth: 0
      - name: Normalize Notepad print integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          notepad_path=Path("js/notepad.js")
          source=notepad_path.read_text(encoding="utf-8")
          lines=source.splitlines()
          matches=[i for i,line in enumerate(lines) if 'byId("notePrint").addEventListener' in line]
          if len(matches)!=1:
              raise SystemExit(f"expected one Notepad print handler, found {len(matches)}")
          lines[matches[0]]='  byId("notePrint").addEventListener("click",()=>window.print())'
          notepad_path.write_text("\n".join(lines)+("\n" if source.endswith("\n") else ""),encoding="utf-8")

          transform_path=Path("tools/apply-site-shell-polish.py")
          transform=transform_path.read_text(encoding="utf-8")
          start=transform.index("# Notepad keeps Print")
          end=transform.index("# PowerShell biography",start)
          transform=transform[:start]+"# Notepad print integration was normalized by the workflow.\n\n"+transform[end:]
          transform_path.write_text(transform,encoding="utf-8")
          PY
      - name: Apply production transformation
        run: python3 tools/apply-site-shell-polish.py
      - name: Commit transformed site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No transformation changes produced"
            exit 1
          fi
          git commit -m "refactor: polish portfolio shell and remove printer"
          git push origin HEAD:agent/site-shell-polish
