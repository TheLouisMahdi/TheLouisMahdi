name: Apply Site Shell Polish

on:
  push:
    branches: [agent/site-shell-polish]
    paths:
      - "tools/apply-site-shell-polish.py"
      - ".github/workflows/apply-site-shell-polish.yml"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/site-shell-polish
          fetch-depth: 0
      - name: Apply production transformation
        run: python3 tools/apply-site-shell-polish.py
      - name: Commit transformed site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No transformation changes produced"
            exit 1
          fi
          git commit -m "refactor: polish portfolio shell and remove printer"
          git push origin HEAD:agent/site-shell-polish
