name: Deploy Profile AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai-worker/**"
      - ".github/workflows/deploy-profile-ai.yml"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare secrets are not configured; deployment skipped."
          fi

      - name: Deploy Worker
        if: steps.config.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ai-worker
          command: deploy

      - name: Configure frontend endpoint
        if: steps.config.outputs.ready == 'true'
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          URL="$(printf '%s' "$DEPLOYMENT_URL" | awk '{print $1}')"
          test -n "$URL"
          case "$URL" in
            http://*|https://*) ;;
            *) URL="https://$URL" ;;
          esac
          printf 'export const AI_ENDPOINT="%s/api/chat"\n' "${URL%/}" > js/ai-config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/ai-config.js
          if ! git diff --cached --quiet; then
            git commit -m "chore: configure deployed profile AI endpoint [skip ci]"
            git push
          fi
