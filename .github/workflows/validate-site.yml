name: Validate Interactive Site

on:
  push:
    branches:
      - main
      - agent/windows7-interactions-python
      - agent/windows7-complete-simulator
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js -type f -name '*.js' -print0)
      - name: Check required site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f EKA_COMMANDS.txt
          test -f css/runtime.css
          test -f js/app.js
          test -f js/interaction.js
          test -f js/vfs.js
          test -f js/python.js
          test -f js/python-worker.js
          test -f js/terminal.js
          test -f js/receipt.js
          test -f js/system.js
          test -f js/system-apps.js
          grep -q 'type="module" src="js/app.js"' index.html
          grep -q 'loadPyodide' js/python-worker.js
          grep -q 'Eka Command Deck.txt' EKA_COMMANDS.txt
      - name: Run simulator smoke checks
        run: node tests/smoke.mjs
