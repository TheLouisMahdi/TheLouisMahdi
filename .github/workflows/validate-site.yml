name: Validate Interactive Site

on:
  push:
    branches:
      - main
      - agent/windows7-interactions-python
      - agent/windows7-complete-simulator
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js ai-worker/src tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0)
      - name: Check required site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f EKA_COMMANDS.txt
          test -f css/runtime.css
          test -f css/mobile-fit.css
          test -f js/app.js
          test -f js/mobile-layout.js
          test -f js/interaction.js
          test -f js/vfs.js
          test -f js/python.js
          test -f js/python-worker.js
          test -f js/terminal.js
          test -f js/receipt.js
          test -f js/system.js
          test -f js/system-apps.js
          test -f js/app-registry.js
          test -f js/html.js
          test -f js/notepad.js
          test -f js/calculator.js
          test -f js/browser.js
          test -f js/run.js
          test -f js/ai-config.js
          test -f ai-worker/src/index.js
          test -f ai-worker/wrangler.jsonc
          grep -q 'type="module" src="js/app.js"' index.html
          grep -q 'loadPyodide' js/python-worker.js
          grep -q 'Eka Command Deck.txt' EKA_COMMANDS.txt
      - name: Run simulator smoke checks
        run: node tests/smoke.mjs
      - name: Run core regression checks
        run: node tests/core.mjs
      - name: Run Workers AI regression check
        run: node tests/ai-worker.mjs
      - name: Probe exact Workers AI payload
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Cloudflare secrets are unavailable to this workflow."
            exit 2
          fi

          raw_account_len="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | wc -c | tr -d ' ')"
          ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          clean_account_len="$(printf '%s' "$ACCOUNT_ID" | wc -c | tr -d ' ')"
          TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          echo "account_id_raw_length=$raw_account_len"
          echo "account_id_clean_length=$clean_account_len"
          echo "account_id_whitespace_removed=$([ "$raw_account_len" = "$clean_account_len" ] && echo no || echo yes)"
          [[ "$ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] && echo "account_id_shape=valid" || echo "account_id_shape=invalid"

          node tests/capture-ai-input.mjs
          cp /tmp/current-ai-input.json /tmp/low-ai-input.json
          cp /tmp/current-ai-input.json /tmp/low512-ai-input.json
          node -e 'const fs=require("fs");const p="/tmp/low-ai-input.json";const x=JSON.parse(fs.readFileSync(p));x.reasoning_effort="low";fs.writeFileSync(p,JSON.stringify(x))'
          node -e 'const fs=require("fs");const p="/tmp/low512-ai-input.json";const x=JSON.parse(fs.readFileSync(p));x.reasoning_effort="low";x.max_completion_tokens=512;fs.writeFileSync(p,JSON.stringify(x))'

          run_case(){
            label="$1"
            payload="$2"
            output="/tmp/${label}-response.json"
            status="$(curl -sS -o "$output" -w '%{http_code}' \
              "https://api.cloudflare.com/client/v4/accounts/${ACCOUNT_ID}/ai/run/@cf/zai-org/glm-4.7-flash" \
              -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary "@${payload}" || true)"
            echo "=== ${label}: HTTP ${status} ==="
            node - "$output" <<'NODE'
          const fs=require("fs")
          const path=process.argv[2]
          const data=JSON.parse(fs.readFileSync(path,"utf8"))
          const result=data.result||data
          const choice=result.choices?.[0]||{}
          const message=choice.message||{}
          const content=typeof message.content==="string"?message.content:""
          const reasoning=typeof message.reasoning_content==="string"?message.reasoning_content:typeof message.reasoning==="string"?message.reasoning:""
          console.log(JSON.stringify({
            success:data.success,
            errors:data.errors,
            finish_reason:choice.finish_reason,
            content_present:Boolean(content.trim()),
            content:content||null,
            reasoning_chars:reasoning.length,
            completion_tokens:result.usage?.completion_tokens,
            neurons:result.usage?.neurons
          },null,2))
          NODE
          }

          run_case current220 /tmp/current-ai-input.json
          run_case low220 /tmp/low-ai-input.json
          run_case low512 /tmp/low512-ai-input.json
      - name: Probe live Profile AI
        shell: bash
        run: |
          set -u
          BASE="https://eka-profile-ai.poimu80.workers.dev"

          echo "=== HEALTH ==="
          health_status="$(curl -sS -o /tmp/ai-health.json -D /tmp/ai-health.headers -w '%{http_code}' "$BASE/health" || true)"
          cat /tmp/ai-health.json 2>/dev/null || true
          echo
          echo "health_status=$health_status"

          echo "=== CORS PREFLIGHT ==="
          options_status="$(curl -sS -o /tmp/ai-options.txt -D /tmp/ai-options.headers -w '%{http_code}' -X OPTIONS "$BASE/api/chat" \
            -H 'Origin: https://thelouismahdi.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' || true)"
          grep -i '^access-control-' /tmp/ai-options.headers 2>/dev/null || true
          echo "options_status=$options_status"

          echo "=== LIVE CHAT ==="
          chat_status="$(curl -sS -o /tmp/ai-chat.json -D /tmp/ai-chat.headers -w '%{http_code}' -X POST "$BASE/api/chat" \
            -H 'Origin: https://thelouismahdi.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"message":"Reply briefly: what does Mahdi work on?","history":[]}' || true)"
          cat /tmp/ai-chat.json 2>/dev/null || true
          echo
          echo "chat_status=$chat_status"

          test "$health_status" = "200"
          test "$options_status" = "204"
          test "$chat_status" = "200"
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > "$RUNNER_TEMP/site.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          node tests/browser.mjs
          node tests/browser-regression.mjs
          node tests/mobile-layout.mjs
