name: Validate Interactive Site

on:
  push:
    branches:
      - main
      - agent/windows7-interactions-python
      - agent/windows7-complete-simulator
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find js ai-worker/src -type f -name '*.js' -print0)
      - name: Check required site files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f EKA_COMMANDS.txt
          test -f css/runtime.css
          test -f css/mobile-fit.css
          test -f js/app.js
          test -f js/mobile-layout.js
          test -f js/interaction.js
          test -f js/vfs.js
          test -f js/python.js
          test -f js/python-worker.js
          test -f js/terminal.js
          test -f js/receipt.js
          test -f js/system.js
          test -f js/system-apps.js
          test -f js/app-registry.js
          test -f js/html.js
          test -f js/notepad.js
          test -f js/calculator.js
          test -f js/browser.js
          test -f js/run.js
          test -f js/ai-config.js
          test -f ai-worker/src/index.js
          test -f ai-worker/wrangler.jsonc
          grep -q 'type="module" src="js/app.js"' index.html
          grep -q 'loadPyodide' js/python-worker.js
          grep -q 'Eka Command Deck.txt' EKA_COMMANDS.txt
      - name: Run simulator smoke checks
        run: node tests/smoke.mjs
      - name: Run core regression checks
        run: node tests/core.mjs
      - name: Run Workers AI regression check
        run: node tests/ai-worker.mjs
      - name: Probe live Profile AI
        shell: bash
        run: |
          set -u
          BASE="https://eka-profile-ai.poimu80.workers.dev"

          echo "=== HEALTH ==="
          health_status="$(curl -sS -o /tmp/ai-health.json -D /tmp/ai-health.headers -w '%{http_code}' "$BASE/health" || true)"
          cat /tmp/ai-health.headers 2>/dev/null || true
          cat /tmp/ai-health.json 2>/dev/null || true
          echo
          echo "health_status=$health_status"

          echo "=== CORS PREFLIGHT ==="
          options_status="$(curl -sS -o /tmp/ai-options.txt -D /tmp/ai-options.headers -w '%{http_code}' -X OPTIONS "$BASE/api/chat" \
            -H 'Origin: https://thelouismahdi.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type' || true)"
          cat /tmp/ai-options.headers 2>/dev/null || true
          cat /tmp/ai-options.txt 2>/dev/null || true
          echo
          echo "options_status=$options_status"

          echo "=== LIVE CHAT ==="
          chat_status="$(curl -sS -o /tmp/ai-chat.json -D /tmp/ai-chat.headers -w '%{http_code}' -X POST "$BASE/api/chat" \
            -H 'Origin: https://thelouismahdi.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"message":"Reply briefly: what does Mahdi work on?","history":[]}' || true)"
          cat /tmp/ai-chat.headers 2>/dev/null || true
          cat /tmp/ai-chat.json 2>/dev/null || true
          echo
          echo "chat_status=$chat_status"

          test "$health_status" = "200"
          test "$options_status" = "204"
          test "$chat_status" = "200"
      - name: Install browser test tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 > "$RUNNER_TEMP/site.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ > /dev/null
          node tests/browser.mjs
          node tests/browser-regression.mjs
          node tests/mobile-layout.mjs
